version: 2

updates:
  # The app.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: chore
      include: scope
    ignore:
      # vue-tsc 3.x cannot load TypeScript 7 (package.json pins ~5.9); lift
      # this once vue-tsc supports it.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # @types/node tracks the runtime (Node 22 in Dockerfile + CI), not the
      # newest Node release.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      # One PR a week for the routine stuff; majors still come in one PR each
      # so a breaking change is reviewed on its own.
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  # The documentation site (its own Nuxt app + lockfile).
  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 3
    labels: [dependencies, docs]
    commit-message:
      prefix: chore
      include: scope
    # Same constraints as the app. CI does not typecheck docs/, so a green
    # check on a TypeScript 7 PR here proves nothing.
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  # The actions used by .github/workflows/*.yml.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ['*']
