# Tick — app + Postgres.
# Copy .env.example to .env first: NUXT_SESSION_PASSWORD is REQUIRED (32+ random
# chars — generate with `openssl rand -base64 36`). Compose reads .env automatically.
services:
  app:
    image: ghcr.io/ticktimer/tick:latest # or uncomment `build: .` for a local build
    # build: .
    restart: unless-stopped
    ports:
      # TICK_IP=127.0.0.1 when a reverse proxy runs on the same host. Docker writes
      # published ports straight into iptables, so ufw/firewalld do NOT block them.
      - '${TICK_IP:-0.0.0.0}:${TICK_PORT:-3000}:3000'
    environment:
      NUXT_DATABASE_URL: postgresql://tick:${POSTGRES_PASSWORD:-tick}@db:5432/tick
      NUXT_SESSION_PASSWORD: ${NUXT_SESSION_PASSWORD:?set NUXT_SESSION_PASSWORD in .env (32+ chars, e.g. `openssl rand -base64 36`)}
      NUXT_AUTO_MIGRATE: ${NUXT_AUTO_MIGRATE:-true}
      # open | invite | closed — switch to invite/closed once your own account exists
      NUXT_PUBLIC_REGISTRATION: ${NUXT_PUBLIC_REGISTRATION:-open}
      # blank = 10 per IP per minute; 0 disables (rate-limit at the proxy instead)
      NUXT_AUTH_RATE_LIMIT: ${NUXT_AUTH_RATE_LIMIT:-}
      # Mail stays off until both NUXT_SMTP_HOST and NUXT_MAIL_FROM are set
      NUXT_SMTP_HOST: ${NUXT_SMTP_HOST:-}
      NUXT_SMTP_PORT: ${NUXT_SMTP_PORT:-}
      NUXT_SMTP_USER: ${NUXT_SMTP_USER:-}
      NUXT_SMTP_PASS: ${NUXT_SMTP_PASS:-}
      NUXT_SMTP_SECURE: ${NUXT_SMTP_SECURE:-}
      NUXT_MAIL_FROM: ${NUXT_MAIL_FROM:-}
      # NUXT_DEMO_MODE is deliberately not passed through: it wipes and reseeds
      # the demo org. Add it here by hand only on a throwaway demo instance.
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/login']
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tick
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tick}
      POSTGRES_DB: tick
    volumes:
      - tick-pgdata:/var/lib/postgresql/data
    # Uncomment to reach Postgres from the host (localhost only):
    # ports:
    #   - '127.0.0.1:5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tick -d tick']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tick-pgdata:
